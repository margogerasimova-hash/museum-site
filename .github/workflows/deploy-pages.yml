name: Публікація на GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-links:
    name: Биті посилання й файли
    runs-on: ubuntu-latest
    steps:
      - name: Отримати файли сайту
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Перевірити посилання, зображення й стилі
        run: python3 .github/scripts/check_links.py

  deploy:
    name: Публікація
    needs: check-links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Отримати файли сайту
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Запакувати сайт для GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Опублікувати
        id: deployment
        uses: actions/deploy-pages@v4
